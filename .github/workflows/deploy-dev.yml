name: Deploy development
on:
  workflow_run:
    workflows: [Backend and PostgreSQL, Playwright browser tests, Development and production isolation, Observability end-to-end]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: wecode-release
  cancel-in-progress: false
jobs:
  gate:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (branch.commit.sha !== sha) return;
            for (const workflow_id of ['backend.yml', 'e2e.yml', 'isolation.yml', 'observability.yml']) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id, branch: 'main', event: 'push', head_sha: sha, per_page: 1
              });
              if (data.workflow_runs[0]?.conclusion !== 'success') return;
            }
            core.setOutput('ready', 'true');
            core.setOutput('sha', sha);
  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: APP_VERSION=${{ needs.gate.outputs.sha }}
          tags: ghcr.io/theali7/wecode7:${{ needs.gate.outputs.sha }}
      - name: Deploy the published digest to development
        env:
          WECODE_DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'render' }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ghcr.io/theali7/wecode7@${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.gate.outputs.sha }}
        run: python3 -m deploy.release --environment development --image "$IMAGE" --version "$VERSION"
      - name: Record the healthy development release
        env:
          IMAGE: ghcr.io/theali7/wecode7@${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.gate.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path("release.json").write_text(json.dumps({
              "image": os.environ["IMAGE"], "version": os.environ["VERSION"],
              "run_id": os.environ["GITHUB_RUN_ID"]
          }) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: development-release
          path: release.json
          retention-days: 30
