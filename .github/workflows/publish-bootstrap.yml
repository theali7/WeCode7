name: Publish bootstrap image
on:
  push:
    branches: [assignment2-observability]
    paths: [.github/workflows/publish-bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: github.repository == 'theali7/WeCode7'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish initial image for new Free Render services
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: APP_VERSION=${{ github.sha }}
          tags: ghcr.io/theali7/wecode7:bootstrap-${{ github.sha }}
      - name: Record immutable reference
        env:
          IMAGE: ghcr.io/theali7/wecode7@${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path("bootstrap-image.json").write_text(json.dumps({
              "image": os.environ["IMAGE"], "version": os.environ["GITHUB_SHA"],
              "note": "Image publication only; no live deployment or production promotion"
          }, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-image
          path: bootstrap-image.json
          retention-days: 7
