{
  "rule_files": [
    "alerts.yaml"
  ],
  "evaluation_interval": "30s",
  "tests": [
    {
      "interval": "30s",
      "input_series": [
        {
          "series": "wecode_progress_writes{service_name=\"wecode-api\",deployment_environment_name=\"development\",service_version=\"test\",outcome=\"error\"}",
          "values": "0+10x20"
        },
        {
          "series": "wecode_http_requests{service_name=\"wecode-api\",deployment_environment_name=\"development\",service_version=\"test\",http_route=\"/api/health\",http_response_status_code=\"503\"}",
          "values": "0+10x20"
        }
      ],
      "alert_rule_test": [
        {
          "alertname": "WeCodeProgressWriteFailures",
          "eval_time": "3m",
          "exp_alerts": [
            {
              "exp_labels": {
                "service_name": "wecode-api",
                "deployment_environment_name": "development",
                "service_version": "test",
                "severity": "critical",
                "owner": "wecode-maintainer"
              },
              "exp_annotations": {
                "summary": "Repeated failures while saving learning progress",
                "description": "At least three observed progress-write failures within five minutes; condition persisted for one minute.",
                "runbook": "Check database availability, application logs, recent deployment and progress-write traces.",
                "dashboard_url": "http://localhost:3000/d/wecode-overview?var-environment=development&var-version=test"
              }
            }
          ]
        },
        {
          "alertname": "WeCodeReadinessFailures",
          "eval_time": "3m",
          "exp_alerts": [
            {
              "exp_labels": {
                "service_name": "wecode-api",
                "deployment_environment_name": "development",
                "service_version": "test",
                "severity": "critical",
                "owner": "wecode-maintainer"
              },
              "exp_annotations": {
                "summary": "Application database readiness is repeatedly failing",
                "description": "At least three observed HTTP 503 readiness responses within five minutes; condition persisted for one minute.",
                "runbook": "Check PostgreSQL availability and startup migrations before considering application code changes.",
                "dashboard_url": "http://localhost:3000/d/wecode-overview?var-environment=development&var-version=test"
              }
            }
          ]
        },
        {
          "alertname": "WeCodeProgressWriteFailures",
          "eval_time": "30s",
          "exp_alerts": []
        },
        {
          "alertname": "WeCodeReadinessFailures",
          "eval_time": "30s",
          "exp_alerts": []
        }
      ]
    },
    {
      "interval": "30s",
      "input_series": [
        {
          "series": "wecode_progress_writes{service_name=\"wecode-api\",deployment_environment_name=\"development\",service_version=\"test\",outcome=\"error\"}",
          "values": "0+0x20"
        }
      ],
      "alert_rule_test": [
        {
          "alertname": "WeCodeProgressWriteFailures",
          "eval_time": "5m",
          "exp_alerts": []
        },
        {
          "alertname": "WeCodeReadinessFailures",
          "eval_time": "5m",
          "exp_alerts": []
        }
      ]
    },
    {
      "interval": "30s",
      "input_series": [
        {
          "series": "wecode_progress_writes{service_name=\"wecode-api\",deployment_environment_name=\"development\",service_version=\"test\",outcome=\"error\"}",
          "values": "0 10 10+0x24"
        }
      ],
      "alert_rule_test": [
        {
          "alertname": "WeCodeProgressWriteFailures",
          "eval_time": "10m",
          "exp_alerts": []
        }
      ]
    }
  ]
}
